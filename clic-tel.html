const btnSol = document.querySelector('.btn-sol');
const btnSect = document.querySelector('.btn-sect');
const btnSsMenuSol = btnSol.querySelectorAll('.btn-ss-menu');
const btnSsMenuSect = btnSect.querySelectorAll('.btn-ss-menu');

// Fonction pour retirer la classe 'premiere-active' du premier élément ayant la classe 'btn-ss-menu'
function removePremiereActive(parentElements) {
  parentElements.forEach(parentElement => {
    const firstBtnSsMenu = parentElement.querySelector('.btn-ss-menu.premiere-active');
    if (firstBtnSsMenu) {
      firstBtnSsMenu.classList.remove('premiere-active');
    }
  });
}

// Fonction pour ajouter la classe 'btn-active' au survol d'un élément ayant la classe 'btn-ss-menu'
function addBtnActive() {
  const allBtnSsMenu = [...btnSsMenuSol, ...btnSsMenuSect];

  allBtnSsMenu.forEach(btn => {
    btn.addEventListener('mouseenter', function() {
      removePremiereActive([btnSol, btnSect]);

      allBtnSsMenu.forEach(btn => {
        btn.classList.remove('btn-active');
      });

      this.classList.add('btn-active');
    });
  });

  allBtnSsMenu.forEach(btn => {
    btn.addEventListener('mouseleave', function() {
      const hoveredBtn = document.querySelector('.btn-ss-menu:hover');
      if (!hoveredBtn) {
        btnSsMenuSol[0].classList.add('premiere-active');
        btnSsMenuSect[0].classList.add('premiere-active');
      }
    });
  });
}

// Ajout de la classe 'premiere-active' au premier élément ayant la classe 'btn-ss-menu' dans btnSol et btnSect
btnSsMenuSol[0].classList.add('premiere-active');
btnSsMenuSect[0].classList.add('premiere-active');

// Appel de la fonction pour initialiser le comportement
addBtnActive();
//# sourceURL=mfn-scripts-js-after
</script>
